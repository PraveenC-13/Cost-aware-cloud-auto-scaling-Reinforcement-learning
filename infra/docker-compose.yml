# infra/docker-compose.yml
# Co-owned by Praveen C (backend-api, monitoring-agent blocks) and Pooja V
# (everything else + keeping this file in sync as new services/env vars land).
#
# Run everything with:  docker compose -f infra/docker-compose.yml up --build
#
version: "3.9"

services:

  # --- Data stores ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoscaler
      POSTGRES_USER: autoscaler
      POSTGRES_PASSWORD: autoscaler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: hkbk
      DOCKER_INFLUXDB_INIT_BUCKET: autoscaler
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-only-influx-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2

  # --- The application being monitored/scaled (stand-in for a real workload) ---
  sample-app:
    image: nginx:alpine
    ports:
      - "8090:80"

  # --- Praveen C's services ---
  backend-api:
    build: ../backend-api
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: autoscaler
      DB_USER: autoscaler
      DB_PASSWORD: autoscaler
      DOCKER_COMPOSE_FILE: /workspace/infra/docker-compose.yml
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../:/workspace
    depends_on:
      - postgres

  monitoring-agent:
    build: ../monitoring-agent
    environment:
      CONTAINERS: sample-app
      POLL_INTERVAL_SECONDS: "10"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: hkbk
      INFLUXDB_BUCKET: autoscaler
      INFLUXDB_TOKEN: dev-only-influx-token
      PORT: "9100"
    ports:
      - "9100:9100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - influxdb
      - sample-app

  # --- Namratha U's service ---
  prediction-service:
    build: ../prediction-service
    ports:
      - "8000:8000"

  # --- Pooja Surve's service ---
  rl-engine:
    build: ../rl-engine
    ports:
      - "8001:8001"
    depends_on:
      - prediction-service

  # --- Pooja V's service ---
  dashboard:
    build: ../dashboard
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend-api

volumes:
  postgres-data:
  influxdb-data:
